name: Shipping countdown tests

on:
  pull_request:
    paths:
      - "src/scripts/**"
      - "assets/*.min.js"
      - "vite.config.js"
      - "tools/shipping-countdown.test.mjs"
      - "package*.json"
      - ".github/workflows/shipping-countdown-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run test:shipping-countdown
      - run: npm run build
      - run: git diff --exit-code -- 'assets/*.min.js'
